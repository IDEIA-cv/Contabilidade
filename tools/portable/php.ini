; PHP portátil do IDEIA Contabilidade (Windows). O extension_dir é passado pelo lançador.
extension=curl
extension=fileinfo
extension=mbstring
extension=openssl
extension=pdo_sqlite
extension=sqlite3
extension=zip
memory_limit=512M
upload_max_filesize=64M
post_max_size=80M
display_errors=Off
log_errors=On
date.timezone=Atlantic/Cape_Verde
